<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video &amp; Media Downloader store screenshot</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        align-items: center;
        background:
          radial-gradient(circle at 82% 18%, rgb(34 211 238 / 22%), transparent 26%),
          radial-gradient(circle at 12% 82%, rgb(79 70 229 / 30%), transparent 32%),
          #0b1020;
        color: white;
        display: grid;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        grid-template-columns: 1fr 500px;
        min-height: 720px;
        overflow: hidden;
        padding: 44px 76px;
        width: 1280px;
      }
      .copy { max-width: 570px; }
      .brand {
        align-items: center;
        display: flex;
        font-size: 20px;
        font-weight: 800;
        gap: 12px;
        margin-bottom: 42px;
      }
      .brand img { height: 48px; width: 48px; }
      .eyebrow {
        color: #67e8f9;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 50px;
        letter-spacing: -.045em;
        line-height: 1.04;
        margin: 16px 0 22px;
      }
      .lead {
        color: #cbd5e1;
        font-size: 20px;
        line-height: 1.55;
        margin: 0 0 34px;
        max-width: 520px;
      }
      .features {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .feature {
        background: rgb(255 255 255 / 8%);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 999px;
        color: #e2e8f0;
        font-size: 14px;
        font-weight: 700;
        padding: 10px 15px;
      }
      .window {
        background: #e2e8f0;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 22px;
        box-shadow: 0 30px 80px rgb(0 0 0 / 42%);
        overflow: hidden;
        transform: rotate(1deg);
        width: 452px;
      }
      .window-bar {
        align-items: center;
        background: #f8fafc;
        display: flex;
        gap: 7px;
        height: 38px;
        padding: 0 14px;
      }
      .window-bar span {
        background: #cbd5e1;
        border-radius: 50%;
        height: 9px;
        width: 9px;
      }
      iframe {
        border: 0;
        display: block;
        /* Replaced with the popup's own content height once it loads, so no
           view shows a scrollbar or a band of dead space below the footer. */
        height: 560px;
        width: 420px;
      }
      .popup-wrap { background: #f8fafc; padding-right: 32px; }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="brand">
        <img src="../icon.svg" alt="">
        <span>Video &amp; Media Downloader</span>
      </div>
      <div id="eyebrow" class="eyebrow">Private video saver</div>
      <h1 id="headline">Detect. Download. Done.</h1>
      <p id="lead" class="lead">
        Save supported direct videos and HLS streams through a private, on-device workflow.
      </p>
      <div class="features">
        <span class="feature">Direct video + HLS</span>
        <span class="feature">Seekable MP4 output</span>
        <span class="feature">Background progress</span>
      </div>
    </section>
    <section class="window" aria-label="Video &amp; Media Downloader popup">
      <div class="window-bar"><span></span><span></span><span></span></div>
      <div class="popup-wrap">
        <iframe id="popup" title="Video &amp; Media Downloader popup preview"></iframe>
      </div>
    </section>
    <script>
      // "free" is a framing of the detected view, not a fourth popup view: the
      // popup has no such state, so only the copy beside it changes.
      const copy = {
        detected: {
          eyebrow: "Private video saver",
          features: ["Direct video + HLS", "Frame previews", "Seekable MP4 output"],
          headline: "Detect. Download. Done.",
          lead: "Every detected item shows a frame from the media itself, so you know what you are saving before you save it.",
          popup: "detected"
        },
        downloading: {
          eyebrow: "Private video saver",
          features: ["Cross-tab progress", "Cancel anytime", "Survives tab close"],
          headline: "Follow every download.",
          lead: "Progress stays visible across tabs, and downloads continue after the source tab closes.",
          popup: "downloading"
        },
        free: {
          eyebrow: "Free and on-device",
          features: ["No account", "No subscription", "No ads or telemetry"],
          headline: "Free. All of it.",
          lead: "No account, no subscription, no ads. Every feature is available to everyone, and nothing is sent to the developer.",
          // The downloaded view, so the three store screenshots show three
          // different states rather than repeating the detected list twice.
          popup: "downloaded"
        }
      };

      const view = new URLSearchParams(location.search).get("view") || "detected";
      const active = copy[view] ?? copy.detected;
      const frame = document.querySelector("#popup");
      // The popup builds its rows from a module script, so the height is only
      // final after that has run — hence rAF rather than reading it on load.
      frame.addEventListener("load", () => {
        requestAnimationFrame(() => {
          frame.style.height = `${frame.contentDocument.body.scrollHeight}px`;
          document.body.dataset.ready = "true";
        });
      });
      frame.src = `popup-preview.html?view=${active.popup}`;
      document.querySelector("#eyebrow").textContent = active.eyebrow;
      document.querySelector("#headline").textContent = active.headline;
      document.querySelector("#lead").textContent = active.lead;
      document.querySelector(".features").innerHTML = active.features
        .map((feature) => `<span class="feature">${feature}</span>`)
        .join("");
    </script>
  </body>
</html>
